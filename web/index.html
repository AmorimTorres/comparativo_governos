<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Comparação dos governos Bolsonaro (2019–2022) e Lula 3 (2023–) com dados públicos oficiais: mesma série, mesma métrica e mesma janela de tempo, com fontes, ressalvas e contexto." />
    <meta name="theme-color" content="#009C37" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- Adobe Fonts (Reel). As faces usadas pelo painel estão em src/estilos/reel.css. -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="preconnect" href="https://p.typekit.net" crossorigin />
    <link rel="stylesheet" href="https://use.typekit.net/jgs6nnl.css" />
    <!-- O Safari não aplica ascent/descent-override (src/estilos/reel.css): marca a
         página para a compensação vertical da Reel em src/estilos/global.css. -->
    <script>if (!("ascentOverride" in FontFace.prototype)) document.documentElement.classList.add("sem-metricas");</script>
    <title>Dois governos em dados</title>

    <!-- Prévia em WhatsApp, redes sociais e mensageiros (Open Graph e Twitter).
         %SITE_URL% é trocado no build pelo endereço público (vite.config.ts):
         as redes exigem URL absoluta para a imagem. -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Dois governos em dados" />
    <meta property="og:title" content="Dois governos, os mesmos indicadores" />
    <meta property="og:description" content="Bolsonaro (2019–2022) × Lula 3 (2023–): mesma série, mesma métrica, mesma janela de tempo. Só dados oficiais, com fonte e data de coleta." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:secure_url" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="888" />
    <meta property="og:image:height" content="842" />
    <meta property="og:image:alt" content="Dois governos, os mesmos indicadores. Mesma série, mesma métrica, mesma janela de tempo." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dois governos, os mesmos indicadores" />
    <meta name="twitter:description" content="Bolsonaro (2019–2022) × Lula 3 (2023–) com dados oficiais: mesma série, mesma métrica, mesma janela de tempo." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
  </head>
  <body>
    <div id="raiz"></div>
    <noscript>Este painel precisa de JavaScript. Os dados estão disponíveis em CSV na pasta data/.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
